{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supprimer l'expédition</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="delete-box">
            <h1>⚠️ Suppression</h1>
            <p>Êtes-vous sûr de vouloir supprimer l'expédition <strong>{{ object.reference }}</strong> ?</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="delete-actions">
                    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                    <a href="{% url 'Expedition:liste_expedition' %}" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
